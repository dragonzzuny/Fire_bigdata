# 원본 CSV 컬럼 사전 — 소방안전 빅데이터 플랫폼 실제 배포본 기준
#
# 플랫폼 CSV 의 컬럼명은 한글이 아니라 영문 코드다(RCPT_DT, EMRG_RSCU_EMD_NM …).
# 그리고 주소가 한 컬럼이 아니라 시도/시군구/읍면동/리/도로명 조각으로 나뉘어 온다.
# 코드는 아래 '표준 이름'만 알고, 실제 컬럼은 이 후보 목록으로 해석한다.
#
# `python scripts/01_inspect_raw.py` 가 실제 컬럼과 매칭 결과를 찍어 준다.
# 매칭에 실패한 항목만 여기에 한 줄 추가하면 되고, 파이썬 코드는 건드리지 않는다.
#
# required: 없으면 즉시 멈춘다.  optional: 없으면 해당 피처만 꺼지고 로그에 남는다.

datasets:

  fire:                       # 화재발생현황 — 학습 라벨
    # 화재만 _0000(2005~2020) + _2021(2021) 두 벌을 모두 읽는다. 기간이 겹치지 않는
    # 연속 구간이라 합쳐야 전체 이력이 된다. (SN 은 파일마다 재사용되므로 식별자가 아니다.)
    file_glob: ["*화재발생_0000*", "*화재발생_2021*"]
    required:
      occurred_at: ["RCPT_DT"]
      emd:         ["EMRG_RSCU_EMD_NM", "DONG_NM"]        # 읍면동: 100% 채워진 유일한 위치 단위
    optional:
      sido:        ["EMRG_RSCU_CTPV_NM", "CTPV_NM"]
      sgg:         ["EMRG_RSCU_GUGUN_NM", "GUGUN_NM"]
      ri:          ["RSCU_LI_NM", "LI_NM"]
      road:        ["ROAD_NM"]
      fire_type:   ["EMRG_RSCU_CLSF_NM"]
      kind:        ["EMRG_RSCU_KND_NM"]                   # 전부 '화재' — 아닌 행은 걸러낸다
      station:     ["PLCSCN_NM"]
      center:      ["CNTR_NM"]
      ended_at:    ["SITTN_END_DT"]

  target:                     # 특정소방대상물 — 용도 구성 피처
    # 스냅샷 데이터셋은 최신 한 벌(_2021)만 쓴다. _0000 과 합치면 같은 건물이 두 번 세어진다.
    file_glob: ["*특정소방대상물_2021*"]
    required:
      emd:         ["DONG_NM"]
    optional:
      sido:        ["CTPV_NM"]
      sgg:         ["GUGUN_NM"]
      ri:          ["LI_NM"]
      road:        ["ROAD_NM"]
      name:        ["TRGTOBJ_NM", "RPRS_CONM_NM", "BLDG_NM"]
      usage:       ["MUSES_NM"]                           # 용도: 근린생활/공장/복합건축물 …
      facility:    ["TRGTOBJ_CLSF_NM"]                    # 설치대상 구분: 스프링클러/옥내소화전 …
      station:     ["PLCSCN_NM"]

  business:                   # 다중이용업소 — 업종 구성 피처
    file_glob: ["*다중이용업소_2021*"]
    required:
      emd:         ["DONG_NM"]
    optional:
      sido:        ["CTPV_NM"]
      sgg:         ["GUGUN_NM"]
      ri:          ["LI_NM"]
      road:        ["ROAD_NM"]
      name:        ["BSSH_NM"]
      biz_type:    ["TPBIZ_NM"]
      floors:      ["BLDG_NOFL_CPST"]
      station:     ["PLCSCN_NM"]

  hydrant:                    # 소방용수시설 — 대응취약 분석
    file_glob: ["*소방용수*_2021*"]
    required:
      emd:         ["DONG_NM"]
    optional:
      sido:        ["CTPV_NM"]
      sgg:         ["GUGUN_NM"]
      ri:          ["LI_NM"]
      road:        ["ROAD_NM"]
      facility_type: ["FRUSWTR_NM"]                       # 소화전(지상식)/저수조/급수탑 …
      lat:         ["FRUSWTR_LAT"]                        # 원본 좌표. bbox 검증 후 채택한다.
      lon:         ["FRUSWTR_LOT"]
      station:     ["PLCSCN_NM"]

  inspection:                 # 화재안전특별조사 — 실측 결과 결합 불가. 기본 비활성.
    #
    # 울산 887,753행을 열어 확인한 결과:
    #   OJTFT_MNG_NO(대상물 관리번호) 862,790개 고유 · CHCK_DT(점검일) 96% 채움
    #   SFTY_MNG_GRD_CD(안전관리등급) 0% · EVL2_CD(평가결과) 0% · 주소 컬럼 없음
    # 관리번호로만 대상물을 가리키는데 특정소방대상물 데이터셋에는 그 번호가 없다.
    # 즉 격자에 붙일 방법이 없다 — 기획서 6.기타의 '점검이력 결합 불가'가 이것이다.
    #
    # file_glob 을 비워 두면 파이프라인이 아예 찾지 않는다. 나중에 관리번호가 있는
    # 대상물 데이터를 확보하면 아래 주석을 풀어 되살릴 수 있다.
    file_glob: []               # ["*화재안전특별조사*"]
    required: {}
    optional:
      inspected_at: ["CHCK_DT"]
      target_id:    ["OJTFT_MNG_NO"]
      progress:     ["PRGRS_STTS_CD"]

# ---------------------------------------------------------------------------
# 특정소방대상물 용도(MUSES_NM) 정규화: 부분일치 키워드 -> 표준 용도
# 원본 32종을 그대로 쓰면 격자당 표본이 흩어져 피처가 힘을 못 쓴다.
usage_keywords:
  근린생활:     ["근린생활"]
  공동주택:     ["공동주택", "아파트", "기숙사"]
  복합건축물:   ["복합건축물"]
  공장:         ["공장"]
  창고:         ["창고"]
  판매영업:     ["판매", "영업시설"]
  숙박:         ["숙박", "고시원"]
  노유자:       ["노유자"]
  의료:         ["의료", "병원"]
  교육:         ["교육", "학교", "학원"]
  업무:         ["업무"]
  위험물:       ["위험물", "가스"]
  문화집회:     ["문화", "집회", "종교", "운동"]
  동식물:       ["동식물"]
  기타:         []

# 설치대상 구분(TRGTOBJ_CLSF_NM) 정규화 — 소방시설 수준의 대리 지표
facility_keywords:
  스프링클러:   ["스프링클러", "물분무"]
  옥내소화전:   ["옥내소화전"]
  자동화재탐지: ["자동화재탐지"]
  고층:         ["11층이상", "고층"]
  대형연면적:   ["연면적"]
  일반대상물:   ["일반대상물"]
  기타:         []

# 다중이용업소 업종(TPBIZ_NM) 정규화 — 점검 규칙과 직접 연결된다
biz_type_keywords:
  일반음식점:   ["일반음식점", "휴게음식점", "제과점"]
  노래연습장:   ["노래연습장", "노래방"]
  유흥주점:     ["유흥주점", "단란주점"]
  PC방:         ["인터넷컴퓨터게임시설제공업", "PC방", "게임제공업", "복합유통게임"]
  숙박업:       ["고시원", "숙박", "목욕장", "산후조리"]
  학원:         ["학원", "교습소"]
  실내체육시설: ["골프", "체육", "스크린"]
  영화관:       ["영화상영관", "공연장"]
  기타:         []

# 소방용수시설 종류 — '소화전'만 대응취약 분석의 분모로 삼는다
hydrant_keywords:
  소화전:       ["소화전"]
  저수조:       ["저수조", "저수지", "관정"]
  급수탑:       ["급수탑"]
  기타:         []
