# 원본 CSV 컬럼 별칭 사전
#
# 소방안전 빅데이터 플랫폼의 시도별 데이터셋은 컬럼명이 통일돼 있지 않다.
# 코드는 '표준 이름'만 알고, 실제 컬럼은 아래 후보 목록으로 해석한다.
# `python scripts/01_inspect_raw.py` 가 실제 컬럼을 찍어주므로,
# 매칭에 실패한 항목만 여기에 한 줄 추가하면 된다. 코드 수정은 필요 없다.
#
# required: 없으면 파이프라인이 즉시 멈춘다 (조용히 빈 값으로 넘어가지 않는다).
# optional: 없으면 해당 피처만 비활성화되고 그 사실이 로그에 남는다.

datasets:

  fire:                       # 화재발생현황 — 학습 라벨
    file_glob: ["*화재발생*"]
    required:
      occurred_at: ["화재발생일시","발생일시","신고일시","접수일시","출동일시","화재발생년월일","발생년월일","일시"]
      address:     ["도로명주소","주소","화재발생장소","발생장소","소재지","지번주소","상세주소","장소"]
    optional:
      sgg:         ["시군구","시군구명","관할구역","소방서","관할서","시도"]
      fire_type:   ["화재유형","화재종별","화재구분","장소구분","발화장소"]
      casualties:  ["인명피해","사상자","사망자수"]
      damage:      ["재산피해","재산피해액","피해액"]

  target:                     # 특정소방대상물 — 용도 구성 피처
    file_glob: ["*특정소방대상물*"]
    required:
      address:     ["도로명주소","소재지","주소","소재지도로명주소","소재지지번주소","대상물주소"]
    optional:
      name:        ["대상물명","건물명","명칭","업체명"]
      sgg:         ["시군구","시군구명","관할구역","소방서","관할서"]
      grade:       ["등급","대상물등급","소방안전관리등급","특정소방대상물등급","관리등급","급수"]
      usage:       ["용도","주용도","대상물용도","건축물용도","세부용도","대상구분"]
      floors:      ["층수","지상층수"]
      area:        ["연면적","면적"]

  business:                   # 다중이용업소 — 업종 구성 피처
    file_glob: ["*다중이용업소*"]
    required:
      address:     ["도로명주소","소재지","주소","영업장주소","소재지도로명주소","소재지지번주소"]
    optional:
      name:        ["업소명","영업장명","상호","업체명"]
      sgg:         ["시군구","시군구명","관할구역","소방서","관할서"]
      biz_type:    ["업종","영업종류","업종명","다중이용업종","영업의종류","업태"]

  hydrant:                    # 소방용수시설 — 대응취약 분석
    file_glob: ["*소방용수*","*소화전*"]
    required:
      address:     ["도로명주소","주소","설치장소","소재지","위치","설치위치","지번주소"]
    optional:
      facility_type: ["소방용수시설구분","용수시설구분","구분","시설구분","종류"]
      sgg:         ["시군구","시군구명","관할구역","소방서","관할서"]
      lat:         ["위도","lat","LAT","y","Y"]
      lon:         ["경도","lon","lng","LON","x","X"]

  inspection:                 # 화재안전특별조사 — 보조(점검 이력). 결합 실패해도 무방.
    file_glob: ["*화재안전특별조사*","*특별조사*"]
    required: {}
    optional:
      address:     ["도로명주소","소재지","주소","대상물주소"]
      inspected_at: ["조사일자","점검일자","조사일","일자"]
      result:      ["조사결과","결과","judge","판정"]

# 특정소방대상물 등급 정규화: 원본 표기 -> 표준 등급
grade_map:
  특급: "특급"
  1급: "1급"
  일급: "1급"
  2급: "2급"
  이급: "2급"
  3급: "3급"
  삼급: "3급"

# 다중이용업소 업종 정규화: 부분일치 키워드 -> 표준 업종 (점검 규칙과 연결됨)
biz_type_keywords:
  일반음식점:   ["일반음식점","음식점","휴게음식점","제과점"]
  노래연습장:   ["노래연습장","노래방","코인노래"]
  유흥주점:     ["유흥주점","단란주점","룸살롱","클럽"]
  PC방:         ["인터넷컴퓨터게임시설제공업","PC방","피시방","게임제공업"]
  숙박업:       ["숙박","고시원","모텔","호텔","여관","목욕장"]
  학원:         ["학원","교습소"]
  산후조리원:   ["산후조리"]
  실내체육시설: ["체육","골프","스크린"]
  영화관:       ["영화상영관","영화관","공연장"]
  기타:         []
